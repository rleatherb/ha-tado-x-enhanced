# Services for Tado X integration

set_temperature_offset:
  name: Set temperature offset
  description: Adjust the temperature offset for a Tado X device (valve or sensor). This calibrates the device's temperature reading.
  fields:
    device_id:
      name: Device
      description: The Tado X device to calibrate
      required: true
      selector:
        device:
          integration: tado_x
    offset:
      name: Temperature offset
      description: Temperature offset in °C. Positive values make the device read higher, negative values make it read lower.
      required: true
      example: -2.0
      selector:
        number:
          min: -9.9
          max: 9.9
          step: 0.1
          unit_of_measurement: "°C"

add_meter_reading:
  name: Add meter reading
  description: Upload a meter reading to Tado Energy IQ
  fields:
    device_id:
      name: Tado X Home device
      description: Optional when only one Tado X home is configured; select the Tado X Home device when multiple homes are configured (not a room or thermostat).
      required: false
      selector:
        device:
          integration: tado_x
    reading:
      name: Reading
      description: Meter reading value (integer)
      required: true
      example: 12345
      selector:
        number:
          min: 0
          max: 999999999
          mode: box
    date:
      name: Date
      description: Date of reading (YYYY-MM-DD format, defaults to today)
      required: false
      example: "2026-01-14"
      selector:
        text:

set_eiq_tariff:
  name: Set energy tariff
  description: Set an energy tariff in Tado Energy IQ for cost calculations
  fields:
    device_id:
      name: Tado X Home device
      description: Optional when only one Tado X home is configured; select the Tado X Home device when multiple homes are configured (not a room or thermostat).
      required: false
      selector:
        device:
          integration: tado_x
    tariff:
      name: Tariff
      description: Price per unit (e.g., 0.85 for €0.85/m³)
      required: true
      example: 0.85
      selector:
        number:
          min: 0
          max: 100
          step: 0.01
          mode: box
    unit:
      name: Unit
      description: Energy unit type
      required: true
      example: "m3"
      selector:
        select:
          options:
            - label: "Cubic meters (m³)"
              value: "m3"
            - label: "Kilowatt hours (kWh)"
              value: "kWh"
    start_date:
      name: Start date
      description: Start date for the tariff (YYYY-MM-DD format, defaults to today)
      required: false
      example: "2026-01-01"
      selector:
        datetime:
    end_date:
      name: End date
      description: End date for the tariff (YYYY-MM-DD format, leave empty for ongoing tariff)
      required: false
      example: "2026-12-31"
      selector:
        text:

set_climate_timer:
  name: Set climate timer
  description: Set a room temperature override. Timer (default) requires temperature and duration; Manual requires temperature only; Next time block requires temperature but not duration.
  fields:
    entity_id:
      name: Climate entity
      description: The Tado X climate entity (room) to control
      required: true
      example: "climate.living_room"
      selector:
        entity:
          integration: tado_x
          domain: climate
    temperature:
      name: Temperature
      description: Required for Timer, Manual and Next time block.
      required: false
      example: 22.0
      selector:
        number:
          min: 5.0
          max: 30.0
          step: 0.1
          unit_of_measurement: "°C"
    duration:
      name: Duration
      description: Required only for Timer (1-1440 minutes); ignored for Manual and Next time block.
      required: false
      example: 30
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: "min"
    termination_type:
      name: Termination type
      description: Timer (default if omitted) requires temperature and duration; Manual requires temperature only; Next time block requires temperature only.
      required: false
      default: "TIMER"
      example: "TIMER"
      selector:
        select:
          options:
            - label: "Timer"
              value: "TIMER"
            - label: "Manual"
              value: "MANUAL"
            - label: "Next time block"
              value: "NEXT_TIME_BLOCK"

get_schedule:
  name: Get schedule
  description: Read the current smart heating schedule for a room. Returns the schedule blocks as a response.
  fields:
    entity_id:
      name: Climate entity
      description: The Tado X room to query or control
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate

get_away_schedule:
  name: Get away schedule
  description: Read the stored per-room Away mode, temperature and preheating configuration. Returns the settings as a response without changing them.
  fields:
    entity_id:
      name: Climate entity
      description: The Tado X room whose Away settings should be returned
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate

set_away_schedule:
  name: Set away schedule
  description: Update a room's Tado X Away mode, temperature and optional preheating level. Existing saved schedule profiles are not modified. When enabling Away from OFF, specify a temperature.
  fields:
    entity_id:
      name: Climate entity
      description: The Tado X room whose Away configuration should be updated
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate
    mode:
      name: Away mode
      description: Enable or disable Away temperature control
      required: true
      selector:
        select:
          options:
            - label: "On"
              value: "ON"
            - label: "Off"
              value: "OFF"
    away_temperature:
      name: Away temperature
      description: Temperature in °C when Away mode is ON. If omitted, the current Away temperature is retained when available. Ignored for OFF.
      required: false
      selector:
        number:
          min: 5.0
          max: 30.0
          step: 0.1
          mode: slider
          unit_of_measurement: °C
    preheating_level:
      name: Preheating level
      description: Optional Tado X preheating setting; if omitted, the current setting is preserved.
      required: false
      selector:
        select:
          options:
            - "OFF"
            - "ECO"
            - "BALANCE"
            - "COMFORT"

set_schedule:
  name: Set schedule
  description: Modify the smart heating schedule for a room. Replaces the blocks for the given day type.
  fields:
    entity_id:
      name: Climate entity
      description: The Tado X room to query or control
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate
    day_type:
      name: Day type
      description: Which day(s) this schedule applies to.
      required: true
      example: "MONDAY_TO_SUNDAY"
      selector:
        select:
          options:
            - label: "Every day"
              value: "MONDAY_TO_SUNDAY"
            - label: "Weekdays"
              value: "MONDAY_TO_FRIDAY"
            - label: "Monday"
              value: "MONDAY"
            - label: "Tuesday"
              value: "TUESDAY"
            - label: "Wednesday"
              value: "WEDNESDAY"
            - label: "Thursday"
              value: "THURSDAY"
            - label: "Friday"
              value: "FRIDAY"
            - label: "Saturday"
              value: "SATURDAY"
            - label: "Sunday"
              value: "SUNDAY"
    schedule:
      name: Schedule blocks
      description: >-
        Enter a JSON-formatted string containing an array of schedule blocks. Each block specifies dayType, start, end, and setting with power (ON or OFF) and temperature. Blocks must cover the full day from 00:00 to 24:00 without gaps or overlaps. See the example in the action form.
      required: true
      example: '[{"dayType":"MONDAY","start":"07:00","end":"09:00","setting":{"power":"ON","temperature":{"value":21.0}}}]'
      selector:
        text:
          multiline: true

get_day_report:
  name: Get day report
  description: Read historical temperature, humidity and heating data for a room and date. Returns the report and a summary as a response. Today's data works on all tiers; past days require an Auto-Assist (Premium) subscription.
  fields:
    entity_id:
      name: Climate entity
      description: The Tado X room to query or control
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate
    date:
      name: Date
      description: Date to fetch (YYYY-MM-DD). Defaults to today.
      required: false
      example: "2026-10-13"
      selector:
        text:

get_holiday_mode:
  fields:
    device_id:
      name: Tado X Home device
      description: Optional when only one Tado X home is configured; select the Tado X Home device when multiple homes are configured (not a room or thermostat).
      required: false
      selector:
        device:
          integration: tado_x
  name: Get holiday mode
  description: >-
    Read the home's holiday mode settings (enabled, start/end dates and room
    settings). Returns the settings as a response. Requires an Auto-Assist
    (Premium) subscription.

set_holiday_mode:
  name: Set holiday mode
  description: >-
    Enable or disable holiday mode and optionally set its start/end date.
    Requires an Auto-Assist (Premium) subscription. Use the date/time pickers in local time, or supply ISO-8601 timestamps in YAML.
  fields:
    device_id:
      name: Tado X Home device
      description: Optional when only one Tado X home is configured; select the Tado X Home device when multiple homes are configured (not a room or thermostat).
      required: false
      selector:
        device:
          integration: tado_x
    enabled:
      name: Enabled
      description: Turn holiday mode on (true) or off (false).
      required: true
      example: true
      selector:
        boolean:
    start_date:
      name: Start date
      description: Optional local date/time. Time must be on a 30-minute boundary (HH:00 or HH:30). YAML also accepts ISO-8601 with timezone.
      required: false
      example: "2026-12-20T08:00:00Z"
      selector:
        datetime:
    end_date:
      name: End date
      description: Optional local date/time. Time must be on a 30-minute boundary (HH:00 or HH:30). YAML also accepts ISO-8601 with timezone.
      required: false
      example: "2027-01-05T20:00:00Z"
      selector:
        datetime:

save_schedule_profile:
  name: Save schedule profile
  description: Save the current Home and Away schedule to an existing profile for this home. Use list_schedule_profiles to see available names.
  fields:
    entity_id:
      name: Climate entity
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate
    profile:
      name: Profile name
      required: true
      example: Eco
      selector:
        text:

restore_schedule_profile:
  name: Restore schedule profile
  description: Restore an existing room profile, using its home default if no room snapshot exists. Use list_schedule_profiles to see available names.
  fields:
    entity_id:
      name: Climate entity
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate
    profile:
      name: Profile name
      required: true
      example: Eco
      selector:
        text:

list_schedule_profiles:
  name: List schedule profiles
  description: List configured and unconfigured schedule profiles for a room.
  fields:
    entity_id:
      name: Climate entity
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate

save_schedule_profile_default:
  name: Save default schedule profile
  description: Save this room's live Home and Away schedule as the selected home-wide default. Enter an existing profile name; use list_schedule_profiles to check names.
  fields:
    entity_id:
      name: Climate entity
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate
    profile:
      name: Profile name
      required: true
      selector:
        text:

restore_schedule_profile_default:
  name: Restore default schedule profile
  description: Restore the selected home-wide default Home and Away schedule to this room. Enter an existing profile name; use list_schedule_profiles to check names.
  fields:
    entity_id:
      name: Climate entity
      required: true
      selector:
        entity:
          integration: tado_x
          domain: climate
    profile:
      name: Profile name
      required: true
      selector:
        text:

create_schedule_profile:
  name: Create schedule profile
  description: Create a new home-wide profile class for all rooms, initially copying the current Normal default.
  fields:
    device_id:
      name: Tado X Home device
      description: Required when multiple Tado X homes are configured.
      required: false
      selector:
        device:
          integration: tado_x
    profile:
      name: New profile name
      required: true
      selector:
        text:

delete_schedule_profile:
  name: Delete schedule profile
  description: Delete a user-defined profile class from all rooms of the selected home. Normal, Alternative, Eco and Not in use cannot be deleted. Use list_schedule_profiles to check names.
  fields:
    device_id:
      name: Tado X Home device
      description: Required when multiple Tado X homes are configured.
      required: false
      selector:
        device:
          integration: tado_x
    profile:
      name: Profile name
      required: true
      selector:
        text:

reset_schedule_default:
  name: Reset home schedule default
  description: Remove a customized home-wide template, reverting to the factory schedule. Does not change any room's active schedule or saved room profiles.
  fields:
    device_id:
      name: Tado X Home device
      description: Optional when only one Tado X home is configured; select the Tado X Home device when multiple homes are configured.
      required: false
      selector:
        device:
          integration: tado_x
    profile:
      name: Default profile name
      description: Normal, Alternative, Eco, or Not in use (optional default suffix).
      required: true
      example: Eco
      selector:
        select:
          options:
            - Normal
            - Alternative
            - Eco
            - Not in use

set_polling_options:
  name: Set polling options
  description: Change polling settings for one Tado X home without restarting Home Assistant. Unspecified settings remain unchanged and changes persist across restarts.
  fields:
    device_id:
      name: Tado X Home device
      description: Optional when only one Tado X home is configured; select the Tado X Home device when multiple homes are configured (not a room or thermostat).
      required: false
      selector:
        device:
          integration: tado_x
    scan_interval:
      name: Main update interval
      description: Main coordinator polling interval, 30–3600 seconds.
      selector:
        number:
          min: 30
          max: 3600
          mode: box
    supplementary_poll_multiplier:
      name: Supplementary polling multiplier
      description: 1×, 2×, 5× or 10× the main interval, for enabled supplementary features.
      selector:
        select:
          options:
            - {label: "1× (normal)", value: "1"}
            - {label: "2×", value: "2"}
            - {label: "5×", value: "5"}
            - {label: "10×", value: "10"}
    schedule_poll_interval:
      name: Schedule checking interval
      description: Interval for automatic schedule comparisons, 900–86400 seconds.
      selector:
        number:
          min: 900
          max: 86400
          mode: box
    enable_schedule_polling:
      name: Automatic schedule checking
      description: Enable or disable automatic schedule checking polling for this home.
      selector:
        boolean:
    enable_holiday_polling:
      name: Automatic Holiday Mode checking
      description: Enable or disable automatic holiday mode checking polling for this home.
      selector:
        boolean:
    enable_weather:
      name: Weather
      description: Enable or disable weather polling for this home.
      selector:
        boolean:
    enable_air_comfort:
      name: Air Comfort
      description: Enable or disable air comfort polling for this home.
      selector:
        boolean:
    enable_running_times:
      name: Heating Running Times
      description: Enable or disable heating running times polling for this home.
      selector:
        boolean:
    enable_flow_temp:
      name: Flow Temperature
      description: Enable or disable flow temperature polling for this home.
      selector:
        boolean:
    enable_mobile_devices:
      name: Mobile Devices
      description: Enable or disable mobile devices polling for this home.
      selector:
        boolean:
    enable_hot_water:
      name: Domestic Hot Water
      description: Enable or disable domestic hot water polling for this home.
      selector:
        boolean:

# Whole-home actions operate on rooms configured at integration startup.
# Newly discovered rooms are skipped until the integration is reloaded.
set_climate_timer_home:
  name: Set climate timer for home
  description: Apply one temperature and termination setting to every configured room in the selected Tado home. Rooms are processed sequentially; failures are reported together without undoing successful rooms. Reload the integration after adding a room.
  fields:
    device_id:
      name: Tado X Home device
      description: Optional for one configured home; required for multiple homes. Select the Home device, not a room device.
      required: false
      selector:
        device:
          integration: tado_x
    temperature:
      name: Temperature
      required: true
      selector:
        number:
          min: 5
          max: 30
          step: 0.1
          unit_of_measurement: "°C"
    termination_type:
      name: Termination type
      description: Defaults to TIMER.
      required: false
      selector:
        select:
          options:
            - TIMER
            - MANUAL
            - NEXT_TIME_BLOCK
    duration:
      name: Duration in minutes
      description: Required for TIMER; ignored for other termination types.
      required: false
      selector:
        number:
          min: 1
          max: 1440
          mode: box

restore_schedule_profile_home:
  name: Restore schedule profile for home
  description: Restore each configured room's own saved Home and Away settings for an existing home-wide profile name, falling back to the home default. The name is validated before any room changes. Room failures are aggregated; each room retains its existing rollback behaviour.
  fields:
    device_id:
      name: Tado X Home device
      description: Optional for one configured home; required for multiple homes.
      required: false
      selector:
        device:
          integration: tado_x
    profile:
      name: Existing profile name
      required: true
      example: Eco
      selector:
        text:

save_schedule_profile_home:
  name: Save schedule profile for home
  description: Capture each configured room's current Home and Away settings under an existing home-wide profile name. The name is validated before any room is saved. Existing active schedules are not changed.
  fields:
    device_id:
      name: Tado X Home device
      description: Optional for one configured home; required for multiple homes.
      required: false
      selector:
        device:
          integration: tado_x
    profile:
      name: Existing profile name
      required: true
      example: Eco
      selector:
        text:

set_away_schedule_home:
  name: Set away schedule for home
  description: Update Away settings for every configured room in the selected home. If a temperature or preheating level is omitted, each room retains its own current value when available. Saved profiles are not changed. Failures are reported together.
  fields:
    device_id:
      name: Tado X Home device
      description: Optional for one configured home; required for multiple homes.
      required: false
      selector:
        device:
          integration: tado_x
    mode:
      name: Away mode
      required: true
      selector:
        select:
          options:
            - "ON"
            - "OFF"
    away_temperature:
      name: Away temperature
      description: Used for ON; when omitted, each room's current Away temperature is retained if available.
      required: false
      selector:
        number:
          min: 5.0
          max: 30.0
          step: 0.1
          mode: slider
          unit_of_measurement: "°C"
    preheating_level:
      name: Preheating level
      description: When omitted, each room's current setting is retained.
      required: false
      selector:
        select:
          options:
            - "OFF"
            - "ECO"
            - "BALANCE"
            - "COMFORT"

set_hvac_mode_home:
  name: Set HVAC mode for home
  description: Apply the same HVAC mode to every configured room in the selected Tado home. Auto resumes each room's Tado schedule; heat applies its current target as a manual override; off switches heating off manually. Failures are reported together.
  fields:
    device_id:
      name: Tado X Home device
      description: Optional for one configured home; required for multiple homes.
      required: false
      selector:
        device:
          integration: tado_x
    hvac_mode:
      name: HVAC mode
      required: true
      selector:
        select:
          options:
            - auto
            - heat
            - "off"
